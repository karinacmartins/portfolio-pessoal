            <h1 class="title">Contato</h1>

            <!-- Formulário do google:
             <div class="form">

            <a href="https://wa.me/5511947133156" class="whatsapp-btn" target="_blank"

        </a>

            <form id="contact-form" aria-labelledby="contact-form-title">               

                <h3 id="contact-form-title" class="visually-hidden">Formulário de Contato</h3>                

                <label for="name">Nome:</label>                
                <input type="text" id="name" name="name" required aria-required="true"><label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required aria-required="true">
                <label for="message">Mensagem:</label>
                <textarea id="message" name="message" required aria-required="true"></textarea>
                
                <div class="buttons">
                    <button class="button-contact" type="button" id="clear-btn" aria-label="Limpar o formulário">Limpar</button>
                    <button class="button-contact" type="submit" aria-label="Enviar mensagem">Enviar</button>
                </div>

            </form>


            <div class="resume-link">

                        acesse aqui.
