<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificados</title>
    <link rel="icon" href="../images/favicon.png">

    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet">
   
    <!-- Stilos-->
   <link rel="stylesheet" href="../css/global.css">
   <link rel="stylesheet" href="../css/responsive.css">
   <link rel="stylesheet" href="../css/main.css">
   <link rel="stylesheet" href="../css/certificates.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
   
</head>

<body>
    <header>
         <!-- Seta para voltar ao topo -->
         <button class="scroll-to-top" aria-label="Voltar ao topo" title="Top">
            <i class="fas fa-arrow-up"></i>
        </button>

        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="../../index.html" aria-label="Página inicial">Home</a></li>
                <li><a href="about.html" aria-label="Sobre Karina Martins" aria-current="page">Sobre</a></li>                
                <li><a href="projects.html" aria-label="Projetos de Karina Martins">Projetos</a></li>
                <li><a href="certificates.html" aria-label="Certificados de Karina" aria-current="page">Certificados</a></li>
                <li><a href="contact.html" aria-label="Página de contato">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        
        <section class="certificates">

            <h1 class="title">Meus Certificados</h1>

            <div class="search-bar">
                <input type="text" id="search" placeholder="Buscar...">
                <select id="sortOrder">           
                    <option value="desc">Mais Recente</option>
                    <option value="asc">Mais Antigo</option>
                </select>
            </div>
        
            <div class="filter-tags">
                <button id="filterTecnologia">Tecnologia</button>
                <button id="filterPessoal">Pessoal</button>
                <button id="filterNegocios">Negócios</button>
                <button id="filterEducacao">Educação</button>
                <button id="filterOutros">Outros</button>
                <button id="filterTodos">Todos</button>
                <button id="clearFilters">Limpar Filtros</button>
        
               
        
            </div>
        
        
            <div class="certificates-container" id="certificates">
                <!-- Certificados serão carregados dinamicamente aqui -->
            </div>
        
            <div id="pagination">
                <button id="prevPage" disabled>&laquo; </button>
                <div id="pageNumbers"></div> <!-- Aqui serão gerados os números das páginas -->
                <button id="nextPage"> &raquo;</button>
            </div>
        
        
            <div id="modal" class="modal">
                <span id="closeModal" class="close">&times;</span>
                <img id="modalImage" class="modal-content" src="" alt="Certificado">
            </div>


        </section>
    </main>

    
     <script type="module" src="/assets/js/certificates.js"></script>
     <script typu="module" src="/assets/js/top.js"></script>
     
    <footer>
        <div class="footer-content">
            <p>&copy; <span></span> . KM Todos os direitos reservados.</p>
            <div class="social">
                <span>Made with 🤍</span>

                <!-- Link para o LinkedIn -->
                <a href="https://www.linkedin.com/in/karinacmartins/" target="_blank"
                    aria-label="LinkedIn de Karina Martins" class="tooltip">
                    <img src="/assets/images/icons/linkedin-round-svgrepo-com.svg" alt="LinkedIn">
                    <span class="tooltip-text">LinkedIn</span>
                </a>

                <!-- Link para o GitHub -->
                <a href="https://github.com/karinacmartins" target="_blank" aria-label="GitHub de Karina Martins"
                    class="tooltip">
                    <img src="/assets/images/icons/github-round-svgrepo-com.svg" alt="GitHub">
                    <span class="tooltip-text">GitHub</span>
                </a>

                <!-- Link para o Instagram -->
                <a href="https://www.instagram.com/karinamartins_eu/" target="_blank"
                    aria-label="Instagram de Karina Martins" class="tooltip">
                    <img src="/assets/images/icons/instagram-round-svgrepo-com.svg" alt="Instagram">
                    <span class="tooltip-text">Instagram</span>
                </a>
            </div>
        </div>

        <script>            
            document.querySelector('footer span').textContent = new Date().getFullYear();
        </script>
       
    </footer>
</body>

</html>
